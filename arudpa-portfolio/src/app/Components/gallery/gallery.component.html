<section class="gallery" id="gallery">
  <p class="section-label">Gallery</p>
  <h2>My Designs</h2>
  <div class="gallery-grid">
    <div class="gallery-card" *ngFor="let item of Collections">
      <img [src]="item.image" [alt]="item.title" />
      <div class="gallery-info">
        <h3>{{ item.title }}</h3>
        <p>{{ item.desc }}</p>
      </div>
    </div>
  </div>
</section>
