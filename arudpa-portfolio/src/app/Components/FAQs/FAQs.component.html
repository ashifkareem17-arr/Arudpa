<section class="faqs" id="faqs">
  <p class="section-label">FAQs</p>
  <h2>Frequently Asked Questions</h2>

  <div class="faqs-grid">
    
    <!-- LEFT: FAQs -->
    <div class="faq-list">
      <p class="faq-sub">Your Questions</p>
      <h3 class="faq-title">We're Here to Help</h3>

      <div class="faq-item" *ngFor="let faq of faqs" [class.open]="faq.open" (click)="toggle(faq)">
        <div class="faq-question">
          <span>{{ faq.question }}</span>
          <span class="icon">+</span>
        </div>
        <div class="faq-answer" *ngIf="faq.open">
          <p>{{ faq.answer }}</p>
        </div>
      </div>
    </div>

    <div class="contact-form">
      <p class="form-sub">Get in touch</p>
      <h3 class="form-title">Send us a Message</h3>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Name</label>
          <input class="form-input" type="text" placeholder="Your full name" [(ngModel)]="formData.name"/>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input class="form-input" type="tel" placeholder="+91 00000 00000" [(ngModel)]="formData.phone"/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Mail ID</label>
        <input class="form-input" type="email" placeholder="your@email.com" [(ngModel)]="formData.email"/>
      </div>

      <div class="form-group">
        <label class="form-label">Message</label>
        <textarea class="form-input" placeholder="Tell us about your dream outfit..." [(ngModel)]="formData.message"></textarea>
      </div>

      <button class="submit-btn" (click)="onSubmit()">Send Message</button>
    </div>


  </div>
</section>
